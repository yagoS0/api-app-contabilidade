name: Payment consultation reliability

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  payment-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consulta_test
          POSTGRES_PASSWORD: fixture_only_ci
          POSTGRES_DB: consulta_pagamento_check
        ports:
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U consulta_test -d consulta_pagamento_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://consulta_test:fixture_only_ci@127.0.0.1:55447/consulta_pagamento_check
      DOTENV_CONFIG_PATH: /tmp/payment-validation-no-env
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @contabilidade/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Fiscal result, retry and communication regressions without external calls
        working-directory: apps/api
        env:
          NODE_ENV: test
        run: node ../../node_modules/jest/bin/jest.js --runInBand --silent --testPathPatterns='ConsultaPagamento|consultaPagamento|paymentConfirmation|[Pp]arcelaPagamento|[Pp]agtoWeb|PagamentoConfiavel|PagamentoRetificadora|simulacoesClientePagamento|linhaDigitavelNaGravacao|scheduledRoutine|guidePaymentLookup|pagamentosPaginacao'
      - name: Guide observations and schedule ownership in real PostgreSQL
        working-directory: apps/api
        run: node scripts/verify-payment-consultations-postgres.js --url "$DATABASE_URL"
      - name: Installment identity and concurrent payment checks in real PostgreSQL
        working-directory: apps/api
        run: node scripts/verify-parcela-payment-postgres.js --url "$DATABASE_URL"
