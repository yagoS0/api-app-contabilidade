name: Altan governance

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test governance and parse agent profiles
        run: |
          node --test scripts/governance/check.test.mjs scripts/governance/orchestrate.test.mjs scripts/governance/bootstrap.test.mjs scripts/governance/data-gate.test.mjs
          python3 -c "import pathlib,tomllib; [tomllib.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('.codex').rglob('*.toml')]"
      - name: Check PR impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/governance/check.mjs check --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check push impact
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: node scripts/governance/check.mjs check --base "$BASE_SHA" --head "$HEAD_SHA" --comparison trees

  accounting-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: accounting_test
          POSTGRES_PASSWORD: fixture_only_ci
          POSTGRES_DB: accounting_governance_test
        ports:
          - 55490:5432
        options: >-
          --health-cmd "pg_isready -U accounting_test -d accounting_governance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALTAN_GOVERNANCE_TEST_DATABASE_URL: postgresql://accounting_test:fixture_only_ci@127.0.0.1:55490/accounting_governance_test
      TZ: America/Sao_Paulo
      NODE_ENV: test
      INTEGRACAO_IA_COMERCIAL: "0"
      INTEGRACAO_FISCAL_LEADS: "0"
      INTEGRACAO_WHATSAPP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @contabilidade/api
      - name: Migrate disposable accounting database
        env:
          DATABASE_URL: ${{ env.ALTAN_GOVERNANCE_TEST_DATABASE_URL }}
        run: npm run prisma:migrate:deploy -w @contabilidade/api
      - name: Accounting services, ledger routes and closing contracts
        working-directory: apps/api
        run: node ../../node_modules/jest/bin/jest.js --runInBand --silent --testPathPatterns='application/accounting/|accountingEntries|fechamentoContabil'
