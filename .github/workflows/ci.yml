name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema validate
        env:
          # validate only reads the schema; it does not connect to a database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/schema_validation
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Audit migrations for destructive SQL
        run: npm run prisma:migrations:audit -w @contabilidade/api

      - name: Prisma client generate
        run: npm run prisma:generate -w @contabilidade/api

      - name: Syntax check API critical files
        run: >
          node --check apps/api/src/server.js &&
          node --check apps/api/src/routes/firm/index.js &&
          node --check apps/api/src/routes/invoices.js &&
          node --check apps/api/src/routes/nfse.js &&
          node --check apps/api/src/routes/adn.js

      - name: Build workspaces
        run: npm run build

  whatsapp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate -w @contabilidade/api
      - name: WhatsApp, guides and AI backend regression
        working-directory: apps/api
        run: node ../../node_modules/jest/bin/jest.js --runInBand --testPathPatterns='[Ww]hatsapp|assistente|envioGuia|envioTentativas|classificacaoPorIa|corrigirValorGuia|guiaEmailDestinatarios|destinatarioDaGuia|envioSemFila|envioPendenteNull'
      - name: WhatsApp and AI frontend regression
        working-directory: apps/web
        run: node ../../node_modules/jest/bin/jest.js --runInBand --testPathPatterns='[Ww]hatsapp|liberarComCanais|canalDeEnvio|envioNaTela|colunaEnvio|reenviarGuia|classificacaoIa|botaoDeIa|clientFallbackAtendimento|pollingEntrega|[Cc]orrigirValor|conferenciaNaTela|ofxImport'

  whatsapp-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: whatsapp_check
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: whatsapp_delivery_check
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U whatsapp_check -d whatsapp_delivery_check"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://whatsapp_check:ci_test_only@127.0.0.1:55439/whatsapp_delivery_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @contabilidade/api
      - name: Apply complete migration history to disposable PostgreSQL
        run: npm run prisma:migrate:deploy -w @contabilidade/api
      - name: Verify SERPRO reservations and calendar exceptions in PostgreSQL
        working-directory: apps/api
        run: |
          node scripts/verify-serpro-reservations-postgres.js --url "$DATABASE_URL"
          node scripts/verify-calendar-series-postgres.js --url "$DATABASE_URL"
      - name: Verify concurrent delivery and delayed callbacks
        working-directory: apps/api
        run: node scripts/verify-whatsapp-delivery-postgres.js --url "$DATABASE_URL"
      - name: Verify atomic OFX imports and tenant isolation
        working-directory: apps/api
        run: node scripts/verify-whatsapp-ofx-postgres.js --url "$DATABASE_URL"
      - name: Verify durable inbox, AI leases and budget recovery
        working-directory: apps/api
        env:
          WHATSAPP_TEST_DATABASE_URL: postgresql://whatsapp_check:ci_test_only@127.0.0.1:55439/whatsapp_delivery_check
        run: node scripts/verify-whatsapp-inbound-postgres.js

