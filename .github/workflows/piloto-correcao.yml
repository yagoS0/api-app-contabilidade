name: Piloto de correção de guia

on:
  pull_request:
    paths:
      - 'apps/api/src/**'
      - 'apps/api/prisma/**'
      - 'apps/api/package.json'
      - 'apps/api/scripts/piloto-correcao.test.mjs'
      - 'apps/api/scripts/guia-fechamento.postgres.test.mjs'
      - 'apps/api/scripts/fechamento-coordenacao.postgres.test.mjs'
      - 'scripts/governance/arquitetura/**'
      - 'package*.json'
      - '.github/workflows/piloto-correcao.yml'

permissions:
  contents: read

jobs:
  caracterizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piloto
          POSTGRES_PASSWORD: fixture_ci
          POSTGRES_DB: altan_piloto_governance_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U piloto -d altan_piloto_governance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testar o verificador
        run: node --test scripts/governance/arquitetura/verificar.test.cjs
      - name: Comparar a arquitetura com a base comum
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          git worktree add --detach "$RUNNER_TEMP/altan-base" "$base"
          verifier=scripts/governance/arquitetura/verificar.cjs
          node "$verifier" snapshot "$RUNNER_TEMP/altan-base" > "$RUNNER_TEMP/arquitetura.json"
          node "$verifier" diagnose . "$RUNNER_TEMP/arquitetura.json"
      - name: Caracterizar o piloto no PostgreSQL descartável
        env:
          DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
          ALTAN_TESTE_POSTGRES: '1'
          TEST_CICLO_PG_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
        run: |
          npm run prisma:generate -w @contabilidade/api
          npm run prisma:migrate:deploy -w @contabilidade/api
          npm test -w @contabilidade/api -- --passWithNoTests=false --runInBand --runTestsByPath \
            src/routes/firm/__tests__/liberacaoLegadaAcesso.test.js \
            src/routes/firm/__tests__/liberacaoLegadaAcesso.postgres.test.js \
            src/application/guides/__tests__/liberacaoEntregaCaracterizacao.test.js \
            src/application/guides/__tests__/GuiaParcelaEnvioGuard.test.js \
            src/application/guides/__tests__/entregaGuiaWhatsapp.test.js \
            src/application/guides/__tests__/entregaExternaGuia.test.js \
            src/application/guides/__tests__/envioTentativas.test.js \
            src/application/guides/__tests__/GuideCompanyEmailCiclo.test.js \
            src/modules/operations/domain/__tests__/elegibilidadeRecuperacaoDas448.test.js \
            src/modules/operations/application/__tests__/avaliarElegibilidadeRecuperacaoDas448.test.js \
            src/modules/guides/infrastructure/prisma/__tests__/leituraHistoricoDas448.test.js \
            src/composition/__tests__/previaRecuperacaoDas448.autorizacao.test.js \
            src/composition/__tests__/previaRecuperacaoDas448.postgres.test.js \
            src/modules/operations/presentation/__tests__/apresentarPendenciasDas446.test.js \
            src/routes/firm/__tests__/pendenciasDas446Http.test.js \
            src/routes/firm/__tests__/pendenciasDas446Http.postgres.test.js \
            src/composition/__tests__/conciliacaoDas445.selecao.test.js \
            src/composition/__tests__/conciliacaoDas445.autorizacao.test.js \
            src/composition/__tests__/conciliacaoDas445.postgres.test.js \
            src/modules/operations/application/__tests__/consultarConciliacaoDas445.test.js \
            src/application/fiscal/serpro/__tests__/dasRecuperacao444.test.js \
            src/application/fiscal/serpro/__tests__/dasRecuperacao444.postgres.test.js \
            src/application/fiscal/serpro/__tests__/dasContabilidade443.test.js \
            src/application/fiscal/serpro/__tests__/dasContabilidade443.postgres.test.js \
            src/modules/accounting/application/__tests__/contabilizarDasCapturado.test.js \
            src/application/fiscal/serpro/__tests__/dasDocumento442.postgres.test.js \
            src/modules/fiscal/application/__tests__/persistirDocumentoDas.test.js \
            src/application/fiscal/serpro/__tests__/dasInterpretacao441.test.js \
            src/modules/fiscal/application/__tests__/interpretarRespostaDas.test.js \
            src/application/fiscal/serpro/__tests__/dasCaracterizacao44.test.js \
            src/application/fiscal/serpro/__tests__/dasPersistencia44.postgres.test.js \
            src/routes/firm/__tests__/dasCaracterizacao44.http.test.js \
            src/workers/__tests__/serproPgdasdAgenda.test.js \
            src/application/fiscal/serpro/__tests__/serproHttpReserva.test.js \
            src/application/fiscal/serpro/__tests__/respostasReutilizadas.test.js \
            src/modules/operations/domain/__tests__/projecaoEnvioGuias.test.js \
            src/application/guides/__tests__/cicloEnvioLeituraCaracterizacao.test.js \
            src/application/guides/__tests__/CicloEnvioGuiasService.test.js \
            src/routes/firm/__tests__/cicloEnvioOperacional.http.test.js \
            src/application/guides/__tests__/CicloEnvioGuiasService.postgres.test.js \
            src/application/whatsapp/__tests__/envioGuiaWhatsapp.test.js \
            src/application/whatsapp/__tests__/envioDocumentoGuiaWhatsapp.test.js \
            src/routes/firm/__tests__/liberacaoGuiasCanais.test.js \
            src/application/guides/__tests__/vigenciaDocumento41.postgres.test.js \
            src/application/guides/__tests__/vigenciaDocumentoAcompanhamento.test.js \
            src/application/guides/__tests__/leituraDocumentalCaracterizacao.test.js \
            src/routes/client/__tests__/documentoGuiaDownload41.test.js \
            src/application/guides/__tests__/corrigirValorGuia.test.js \
            src/modules/guides/domain/correcaoDeValor.test.js \
            src/modules/accounting/domain/correcaoDeProvisao.test.js
          node --experimental-vm-modules --test apps/api/scripts/piloto-correcao.test.mjs
          node --test --test-concurrency=1 apps/api/scripts/guia-fechamento.postgres.test.mjs apps/api/scripts/fechamento-coordenacao.postgres.test.mjs
      - name: Caracterizar FS12 B3 sem despacho fiscal
        env:
          NODE_ENV: test
          ALTAN_TESTE_POSTGRES: '1'
          DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
          ALTAN_GOVERNANCE_TEST_DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
        run: >-
          npm test -w @contabilidade/api -- --passWithNoTests=false --runInBand --runTestsByPath
          src/routes/firm/__tests__/fs12B3.postgres.test.js
          src/application/notas/apuracao/v2/__tests__/fs12B3Contratos.test.js
      - name: Validar FS12 manual B3.1 sem cálculo ou transmissão
        env:
          NODE_ENV: test
          ALTAN_TESTE_POSTGRES: '1'
          DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
          ALTAN_GOVERNANCE_TEST_DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
        run: >-
          npm test -w @contabilidade/api -- --passWithNoTests=false --runInBand --runTestsByPath
          src/routes/firm/__tests__/fs12B31.postgres.test.js
          src/routes/firm/__tests__/fs12B31.http.test.js
          src/modules/fiscal/domain/__tests__/serieManualFs12.test.js
          src/modules/fiscal/application/__tests__/confirmarFs12DaApuracao.test.js
          src/modules/fiscal/application/__tests__/consultarFs12DaApuracao.test.js
          src/modules/fiscal/infrastructure/prisma/__tests__/fs12DaApuracao.test.js
          src/modules/identity/domain/__tests__/acessoEmpresaEscritorio.test.js
      - name: Validar vínculo FS12 B3.2 e bloqueio de despacho
        env:
          NODE_ENV: test
          ALTAN_TESTE_POSTGRES: '1'
          DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
          ALTAN_GOVERNANCE_TEST_DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
        run: >-
          npm test -w @contabilidade/api -- --passWithNoTests=false --runInBand --runTestsByPath
          src/modules/fiscal/domain/__tests__/guardaPgdasFs12.test.js
          src/modules/fiscal/application/__tests__/vincularFs12AoCalculo.test.js
          src/modules/fiscal/application/__tests__/registrarFatoCalculoFs12.test.js
          src/modules/fiscal/infrastructure/prisma/__tests__/fs12DoCalculo.postgres.test.js
          src/routes/firm/__tests__/fs12B32.http.test.js
          src/routes/firm/__tests__/fs12B32.postgres.test.js
          src/application/fiscal/serpro/__tests__/fs12B32Transporte.test.js

      - name: Validar fluxo PGDAS com transporte falso e PostgreSQL 16
        env:
          NODE_ENV: test
          ALTAN_TESTE_POSTGRES: '1'
          DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
          ALTAN_GOVERNANCE_TEST_DATABASE_URL: postgresql://piloto:fixture_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/altan_piloto_governance_test
        run: >-
          npm test -w @contabilidade/api -- --passWithNoTests=false --runInBand --forceExit --runTestsByPath
          src/modules/fiscal/application/__tests__/prepararCalculoPgdas.test.js
          src/modules/fiscal/application/__tests__/prepararCalculoPgdas.postgres.test.js
          src/modules/fiscal/application/__tests__/recuperarDocumentosPgdas.test.js
          src/modules/fiscal/domain/__tests__/evidenciaDocumentalPgdas.test.js
          src/modules/fiscal/infrastructure/prisma/__tests__/estadoDocumentalPgdas.test.js
          src/application/fiscal/serpro/__tests__/pgdasFluxoFuncional.test.js
          src/application/fiscal/serpro/__tests__/pgdasDocumentos.test.js
          src/application/fiscal/serpro/__tests__/pgdasSomenteDocumentos.test.js
          src/application/fiscal/serpro/__tests__/capturePgdasDocumentalEstrito.test.js
          src/application/notas/apuracao/v2/__tests__/procedenciaDas.test.js
          src/application/notas/apuracao/v2/__tests__/recuperacaoFechamento.test.js
          src/application/operacoes/__tests__/pgdasFluxoFuncional.test.js
          src/application/operacoes/__tests__/OperationsExecution.test.js
          src/application/operacoes/__tests__/OperationsBatchService.postgres.test.js
          src/routes/firm/__tests__/pgdasFluxoFuncional.http.test.js
          src/routes/firm/__tests__/pgdasFluxoFuncional.postgres.test.js

      - name: Validar interface documental PGDAS sem rede externa
        run: >-
          npm test -w @contabilidade/web -- --runInBand --runTestsByPath
          src/features/apuracao/components/__tests__/fluxoPgdas.test.jsx
          src/features/apuracao-v2/pages/__tests__/fluxoDocumental.test.jsx
          src/features/apuracao/components/__tests__/fechamentoVinculo.test.jsx
          src/features/apuracao/lib/__tests__/entregaPgdas.test.js
