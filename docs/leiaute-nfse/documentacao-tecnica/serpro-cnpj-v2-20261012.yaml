openapi: "3.0.0"
info:
  version: "v2"
  title: "Consulta CNPJ DF v2"
servers:  
  - url: "https://gateway.apiserpro.serpro.gov.br/consulta-cnpj-df/v2"
    description: "Produção"    
paths:
  /basica/{ni}:
    get:
      summary: "Retorna os dados do cadastro de pessoa jurídica (CNPJ) - Básico"
      tags:
        - CNPJ
      description: "Chaves para degustação? &nbsp; [Acesse aqui](https://apicenter.estaleiro.serpro.gov.br/documentacao/consulta-cnpj/pt/quick_start/#como-utilizar-a-api-cnpj-demonstracao)"
      parameters:
        - in: path
          name: ni
          description: Número de inscrição no CNPJ
          required: true
          schema:
            type: string
        - in: "header"
          name: "x-signature"
          description: "Solicitação de assinatura de carimbo de tempo. Informe 1 para assinar, ou deixe em branco para não assinar."
          required: false
          schema:
            type: string
        - in: "header"
          name: "x-request-tag"
          description: "Campo opcional para identificar requisições. O conteúdo é um texto livre para que o cliente possa identificar a origem da requisição, não há validação do seu conteúdo pela API. Máximo 32 caracteres."
          required: false
          schema:
            type: string
            maxLength: 32          
      responses:
        200:
          description: 'OK - Retorna os dados da Pessoa Jurídica.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CNPJ-BASICO'          
          headers:
            stamp:
              schema:
                type: string
              description: 'Assinatura de carimbo de tempo, caso solicitada.'
        206:
          description: 'Conteúdo parcial. Algum campo específico não pôde ser retornado.'
        400:
          description: 'O número de inscrição informado não é válido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    description: 'Mensagem de retorno de validação.'
                    example: 'CNPJ <12345678901234> inválido!'
        404:
          description: 'Não existe CNPJ com o número de inscrição informado.'
        500:
          description: 'Erro interno do servidor.'
