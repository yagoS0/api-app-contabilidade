components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
 
    CNPJ-EMPRESA:
      properties:
        ni:
          type: string
        tipoEstabelecimento:
          type: string
        nomeEmpresarial:
          type: string
        nomeFantasia:
          type: string
        situacaoCadastral:
          $ref: '#/components/schemas/SituacaoCadastral-2'
        naturezaJuridica:
          $ref: '#/components/schemas/CodigoDescricao'
        dataAbertura:
          type: string
        cnaePrincipal:
          $ref: '#/components/schemas/CodigoDescricao'
        cnaeSecundarias:
          $ref: '#/components/schemas/CodigoDescricao-2'
        endereco:
          $ref: '#/components/schemas/Endereco-2'
        municipioJurisdicao:
            $ref: '#/components/schemas/CodigoDescricao'
        telefones:
          items:
            $ref: '#/components/schemas/Telefone'
          type: array
        correioEletronico:
          type: string
        capitalSocial:
          type: string
        porte:
          type: string  
        situacaoEspecial:
          type: string
        dataSituacaoEspecial:
          type: string
        informacoesAdicionais:
          properties:
            optanteSimples:
              type: string
            optanteMei:
              type: string
            listaPeriodoSimples:
              items:
                properties:
                  dataInicio:
                    type: string
                  dataFim:
                    type: string
              type: array
        socios:
          items:
            properties:
              tipoSocio:
                type: string
              cpf:
                type: string
              nome:
                type: string
              qualificacao:
                type: string
              dataInclusao:
                type: string
              pais:
                properties:
                  codigo:
                    type: string
                  descricao:
                    type: string
                type: object
              representanteLegal:
                properties:
                  cpf:
                    type: string
                  nome:
                    type: string
                  qualificacao:
                    type: string
                type: object
          type: array  
      type: object
      
