# ⚠ Root Directory deste servico = RAIZ do repositorio (nao a pasta do app).
# O motivo esta no cabecalho do Dockerfile: o contexto precisa alcancar `packages/shared`.
# ⚠ E o `dockerfilePath` e relativo a RAIZ -- com a pasta do app ele nao seria encontrado.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/portal-cliente-web/Dockerfile"
# ⚠ `packages/**` entra aqui: sem ele, atualizar a lista de municipios nao dispara rebuild deste
# front, e o navegador continua servindo a tabela antiga -- divergencia silenciosa.
watchPatterns = [
  "apps/portal-cliente-web/**",
  "packages/**",
  "package.json",
  "package-lock.json"
]
